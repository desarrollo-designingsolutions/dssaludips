networks:
  ministerio_fevrips-net:
    external: true
    name: ministerio_fevrips-net
    # El nombre de la red debe ser: el nombre de la carpeta que contiene el codigo del ministerio (si la carpeta tiene separacion de espacios se debe unificar con _) "ministerio_" + el nombre de la red que esta en el yml del ministerio "fevrips-net"

services:
  php:
    build:
      context: .
      dockerfile: ./docker/dockerfiles/php.Dockerfile
    # container_name: ${COMPOSE_PROJECT_NAME}_php
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - ministerio_fevrips-net
    # deploy:
    #   replicas: 5   # <-- Solo funciona con Docker Swarm

  vue:
    container_name: ${COMPOSE_PROJECT_NAME}_vue
    build:
      context: .
      dockerfile: docker/dockerfiles/vue3.dockerfile
    volumes:
      - ./frontend/src:/var/www/html/src
      - ./frontend/public:/var/www/html/public
    restart: unless-stopped
    ports:
      - "${VUE_PORT}:5173"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mysql:
    image: mysql:8.0.1
    restart: unless-stopped
    tty: true
    container_name: ${COMPOSE_PROJECT_NAME}_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - ministerio_fevrips-net
    volumes:
      - ./docker/mysql_data:/var/lib/mysql

  redis_6379:
    image: redis:alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis_6379
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_1}:6379"
    volumes:
      - ./docker/redis_data_6379:/data
    networks:
      - ministerio_fevrips-net

  redis_6380:
    image: redis:alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis_6380
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_2}:6379"
    volumes:
      - ./docker/redis_data_6380:/data
    networks:
      - ministerio_fevrips-net

  server:
    image: nginx:1.28
    container_name: ${COMPOSE_PROJECT_NAME}_server
    restart: always
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/certs:/etc/nginx/certs
    environment:
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME}
      - NGINX_HTTPS_PORT=${HTTPS_PORT}
      - SSL_CERT_PATH=${SSL_CERT_PATH}
      - SSL_KEY_PATH=${SSL_KEY_PATH}
    depends_on:
      - php
      - mysql
    networks:
      - ministerio_fevrips-net

  supervisor_reverb:
    build:
      context: .
      dockerfile: ./docker/dockerfiles/supervisor.dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_supervisor_reverb
    volumes:
      - ./backend:/var/www/html
      - ./docker/supervisor/laravel-worker-reverb.conf:/etc/supervisor/conf.d/laravel-worker-reverb.conf
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - php
      - mysql
    networks:
      - ministerio_fevrips-net
    ports:
      - "8080:8080" # expone Reverb
    environment:
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REVERB_HOST=${REVERB_HOST}
      - REVERB_PORT=${REVERB_PORT}
      - REVERB_SCHEME=${REVERB_SCHEME}

  supervisor_queues:
    build:
      context: .
      dockerfile: ./docker/dockerfiles/supervisor.dockerfile
    volumes:
      - ./backend:/var/www/html
      - ./docker/supervisor/laravel-worker-queue.conf:/etc/supervisor/conf.d/laravel-worker-queue.conf
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - php
      - mysql
    networks:
      - ministerio_fevrips-net
    # deploy:
    #   replicas: 5   # <-- Solo funciona con Docker Swarm
